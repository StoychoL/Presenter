<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Partnership Program — Diageo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <div class="tier-tabs" id="tier-tabs"></div>
    <div class="tier-panel" id="tier-panel">
      <div class="tier-hero"><img id="tier-hero-img" alt="" /></div>
      <div class="tier-reward" id="tier-reward"></div>
      <button class="btn secondary select-all-btn" id="select-all-btn">Select all</button>
      <div id="tier-sections"></div>
    </div>
  </main>

  <div class="progress-badge" id="progress-badge">
    <div class="frac" id="progress-frac">0 / 0</div>
    <div class="pct" id="progress-pct">0%</div>
    <div class="target-edit" id="target-edit">edit target</div>
  </div>

  <div class="reset-bar">
    <button class="btn full" id="save-callfile-btn">Save to Store</button>
    <button class="btn secondary full" id="reset-btn">Reset / New store</button>
  </div>

  <div class="modal-backdrop hidden" id="product-modal">
    <div class="modal-card">
      <button class="modal-close" id="modal-close-btn" aria-label="Close">&times;</button>
      <img id="modal-img" alt="" />
      <h2 id="modal-name"></h2>
      <div class="modal-info" id="modal-info"></div>
      <label class="tick-row" id="modal-tick-row" data-action="toggle">
        <input type="checkbox" id="modal-checkbox" />
        <span>In stock</span>
      </label>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="store-picker-modal">
    <div class="modal-card modal-card-narrow">
      <button class="modal-close" id="store-picker-close" aria-label="Close">&times;</button>
      <h2>Save range to store</h2>
      <input type="search" id="store-picker-search" class="date-input" placeholder="Search by store name or postcode" />
      <div class="store-list" id="store-picker-list"></div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/layout-pp.js"></script>
  <script src="js/pp-stats.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/partnership.js"></script>
  <script>renderNav("partnership");</script>
</body>
</html>
