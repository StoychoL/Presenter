<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />

  <title>Partnership Program — Diageo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />

<body>
  <main>
    <div class="tier-tabs" id="tier-tabs"></div>
