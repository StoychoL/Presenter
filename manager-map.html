<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://www.gstatic.com https://api.postcodes.io https://*.tile.openstreetmap.org; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://www.google.com/images/cleardot.gif; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Manager Map — Diageo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="page-map">
  <main class="map-page">
    <div class="map-toolbar">
      <div class="map-meta" id="map-meta"></div>
      <select id="territory-filter" class="map-territory-select" aria-label="Filter by territory"></select>
      <div class="map-legend">
        <span><span class="dot red"></span> Not visited</span>
        <span><span class="dot amber"></span> Partial</span>
        <span><span class="dot green"></span> On track</span>
      </div>
    </div>

    <div class="map-notice hidden" id="map-notice"></div>

    <div id="map-container"></div>

    <p class="empty-note hidden" id="map-empty"></p>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/layout-callfile.js"></script>
  <script src="js/callfile-status.js"></script>
  <script src="js/map-geocode.js"></script>
  <script src="js/map-zoom-guard.js"></script>
  <script src="js/state-shape.js"></script>
  <script src="js/manager-cloud.js"></script>
  <script src="js/manager-map.js"></script>
  <script src="js/manager-nav.js" data-page="map"></script>
</body>
</html>
