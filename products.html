<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://www.gstatic.com https://api.postcodes.io; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://www.google.com/images/cleardot.gif; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Product Presenter — Diageo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <div id="sections"></div>
  </main>

  <div class="summary-bar" id="summary-bar">
    <div class="summary-row"><span>Sum</span><span id="sum-value">£0.00</span></div>
    <div class="summary-row"><span>VAT 20%</span><span id="vat-value">£0.00</span></div>
    <div class="summary-row total"><span>Total</span><span id="total-value">£0.00</span></div>
    <button class="btn secondary full" id="reset-btn">Reset / New client</button>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/layout-products.js"></script>
  <script src="js/state-shape.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/products.js"></script>
  <script src="js/nav.js" data-page="products"></script>
</body>
</html>
