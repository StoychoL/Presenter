<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Call File — Diageo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <div class="callfile-toolbar">
      <label class="btn full" for="callfile-input">Upload Call File</label>
      <input type="file" id="callfile-input" accept=".xls,.xlsx,.csv" hidden />
      <label class="btn secondary full" for="callfile-secondary-input">Upload Secondary Territory</label>
      <input type="file" id="callfile-secondary-input" accept=".xls,.xlsx,.csv" hidden />
      <button type="button" class="btn secondary full" id="add-store-btn">Add store</button>
      <button type="button" class="btn secondary full" id="reset-all-visits-btn">Reset all visits</button>
      <button type="button" class="btn secondary full" id="add-cc-btn">Add Cash & Carry</button>
      <div class="callfile-meta" id="callfile-meta"></div>
    </div>

    <div id="cc-list"></div>

    <div class="search-bar">
      <input type="search" id="callfile-search" placeholder="Search by store name or postcode" />
    </div>

    <div class="grade-tabs" id="grade-tabs"></div>
    <div id="callfile-sections"></div>
  </main>

  <div class="modal-backdrop hidden" id="visit-modal">
    <div class="modal-card modal-card-narrow">
      <button class="modal-close" id="visit-modal-close" aria-label="Close">&times;</button>
      <h2>Log a visit</h2>
      <p class="modal-store-name" id="visit-modal-store"></p>
      <label class="field-label" for="visit-date-input">Visit date</label>
      <input type="date" id="visit-date-input" class="date-input" />
      <div class="modal-actions">
        <button class="btn secondary" id="visit-cancel-btn" type="button">Cancel</button>
        <button class="btn" id="visit-confirm-btn" type="button">Log visit</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="store-modal">
    <div class="modal-card modal-card-narrow">
      <button class="modal-close" id="store-modal-close" aria-label="Close">&times;</button>
      <h2 id="store-modal-title">Add store</h2>
      <label class="field-label" for="store-name-input">Store name</label>
      <input type="text" id="store-name-input" class="date-input" />
      <label class="field-label" for="store-postcode-input">Postcode</label>
      <input type="text" id="store-postcode-input" class="date-input" />
      <label class="field-label" for="store-grade-input">Grade</label>
      <select id="store-grade-input" class="date-input"></select>
      <div class="modal-actions">
        <button class="btn secondary" id="store-cancel-btn" type="button">Cancel</button>
        <button class="btn" id="store-save-btn" type="button">Save</button>
      </div>
      <button class="btn secondary full hidden" id="store-reset-visits-btn" type="button">Reset visits</button>
      <button class="btn danger full hidden" id="store-delete-btn" type="button">Delete store</button>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="cc-modal">
    <div class="modal-card modal-card-narrow">
      <button class="modal-close" id="cc-modal-close" aria-label="Close">&times;</button>
      <h2>Add Cash & Carry</h2>
      <label class="field-label" for="cc-name-input">Name</label>
      <input type="text" id="cc-name-input" class="date-input" />
      <label class="field-label" for="cc-postcode-input">Postcode</label>
      <input type="text" id="cc-postcode-input" class="date-input" />
      <div class="modal-actions">
        <button class="btn secondary" id="cc-cancel-btn" type="button">Cancel</button>
        <button class="btn" id="cc-save-btn" type="button">Save</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="range-modal">
    <div class="modal-card modal-card-narrow modal-card-wide">
      <button class="modal-close" id="range-modal-close" aria-label="Close">&times;</button>
      <h2 id="range-modal-store"></h2>
      <div class="range-snapshot-tabs" id="range-snapshot-tabs"></div>
      <div id="range-snapshot-detail"></div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="cb-modal">
    <div class="modal-card modal-card-narrow">
      <button class="modal-close" id="cb-modal-close" aria-label="Close">&times;</button>
      <h2>Cycle Brief</h2>
      <p class="modal-store-name" id="cb-modal-store"></p>
      <div class="cb-row">
        <span class="cb-row-label">Direct Sale</span>
        <div class="stepper">
          <button data-action="cb-dec" data-cat="direct" type="button">−</button>
          <span class="qty" id="cb-qty-direct">0</span>
          <button data-action="cb-inc" data-cat="direct" type="button">+</button>
        </div>
      </div>
      <div class="cb-row">
        <span class="cb-row-label">Influence Sale</span>
        <div class="stepper">
          <button data-action="cb-dec" data-cat="influence" type="button">−</button>
          <span class="qty" id="cb-qty-influence">0</span>
          <button data-action="cb-inc" data-cat="influence" type="button">+</button>
        </div>
      </div>
      <div class="cb-row">
        <span class="cb-row-label">POS Activation</span>
        <div class="stepper">
          <button data-action="cb-dec" data-cat="pos" type="button">−</button>
          <span class="qty" id="cb-qty-pos">0</span>
          <button data-action="cb-inc" data-cat="pos" type="button">+</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cb-cancel-btn" type="button">Cancel</button>
        <button class="btn" id="cb-confirm-btn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/vendor/xlsx.full.min.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/layout-pp.js"></script>
  <script src="js/pp-stats.js"></script>
  <script src="js/pp-snapshot.js"></script>
  <script src="js/layout-callfile.js"></script>
  <script src="js/callfile-status.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/callfile.js"></script>
  <script>renderNav("callfile");</script>
</body>
</html>
