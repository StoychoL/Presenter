<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://www.gstatic.com https://api.postcodes.io https://*.tile.openstreetmap.org; img-src 'self' data: blob: https://*.tile.openstreetmap.org https://www.google.com/images/cleardot.gif; style-src 'self' 'unsafe-inline'; font-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <title>Manager Dashboard — Diageo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <h1 class="manager-page-title">Territories</h1>
    <p class="manager-page-sub">Every rep's territory, grouped by their Call File territory code.</p>

    <div class="territory-filter-bar">
      <label for="territory-letter-filter" class="field-label">Filter by territory letter</label>
      <select id="territory-letter-filter" class="map-territory-select" aria-label="Filter by territory letter"></select>
    </div>

    <div id="manager-empty" class="manager-empty hidden"></div>
    <div id="territory-grid" class="territory-grid"></div>

    <section id="territory-detail" class="territory-detail hidden" aria-label="Territory detail">
      <div class="territory-detail-head">
        <h2 id="territory-detail-title"></h2>
        <div class="territory-detail-actions">
          <a class="btn small secondary" id="territory-detail-map-link" href="manager-map.html">View on Map</a>
          <button type="button" class="territory-detail-close" id="territory-detail-close" aria-label="Collapse">&times;</button>
        </div>
      </div>
      <div id="territory-detail-body"></div>
    </section>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/layout-callfile.js"></script>
  <script src="js/callfile-status.js"></script>
  <script src="js/home-stats.js"></script>
  <script src="js/state-shape.js"></script>
  <script src="js/manager-cloud.js"></script>
  <script src="js/manager-home.js"></script>
  <script src="js/manager-nav.js" data-page="dashboard"></script>
</body>
</html>
