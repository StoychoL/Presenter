<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Manager sign in — Diageo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <div class="auth-page">
      <div class="auth-card">
        <div class="brand auth-brand">DIAGEO</div>
        <h1 id="auth-title">Manager sign in</h1>
        <p class="auth-error hidden" id="auth-error"></p>
        <form id="auth-form">
          <label class="field-label" for="auth-email">Email</label>
          <input type="email" id="auth-email" class="date-input" autocomplete="username" required />
          <label class="field-label" for="auth-password">Password</label>
          <div class="password-field">
            <input type="password" id="auth-password" class="date-input" autocomplete="current-password" required />
            <button type="button" class="password-toggle-btn" id="auth-password-toggle-btn" aria-label="Show password"></button>
          </div>
          <label class="field-label hidden" for="auth-code" id="auth-code-label">Manager access code</label>
          <input type="text" id="auth-code" class="date-input hidden" autocomplete="off" />
          <button type="submit" class="btn full" id="auth-submit-btn">Sign in</button>
        </form>
        <button type="button" class="auth-link" id="auth-forgot-btn">Forgot password?</button>
        <button type="button" class="auth-link" id="auth-toggle-btn">New here? Create a manager account</button>
        <a class="auth-link" href="login.html">Rep sign in instead</a>
      </div>
    </div>
  </main>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/manager-auth.js"></script>
</body>
</html>
