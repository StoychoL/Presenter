<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Map — Diageo</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="js/vendor/leaflet/leaflet.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main class="map-page">
    <div class="map-toolbar">
      <div class="map-meta" id="map-meta"></div>
      <div class="map-legend">
        <span><span class="dot red"></span> Not visited</span>
        <span><span class="dot amber"></span> Partial</span>
        <span><span class="dot green"></span> On track</span>
        <span><span class="dot platinum-ring"></span> Platinum store</span>
      </div>
    </div>

    <div class="map-notice hidden" id="map-notice"></div>

    <div id="map-container"></div>

    <button type="button" class="locate-btn" id="locate-btn" aria-label="Go to my location">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path>
      </svg>
    </button>

    <p class="empty-note hidden" id="map-empty"></p>
  </main>

  <div class="modal-backdrop hidden" id="visit-modal">
    <div class="modal-card modal-card-narrow">
      <button class="modal-close" id="visit-modal-close" aria-label="Close">&times;</button>
      <h2>Log a visit</h2>
      <p class="modal-store-name" id="visit-modal-store"></p>
      <label class="field-label" for="visit-date-input">Visit date</label>
      <input type="date" id="visit-date-input" class="date-input" />
      <div class="modal-actions">
        <button class="btn secondary" id="visit-cancel-btn" type="button">Cancel</button>
        <button class="btn" id="visit-confirm-btn" type="button">Log visit</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="cc-visit-modal">
    <div class="modal-card modal-card-narrow">
      <button class="modal-close" id="cc-visit-modal-close" aria-label="Close">&times;</button>
      <h2>Log a Cash &amp; Carry visit</h2>
      <p class="modal-store-name" id="cc-visit-modal-store"></p>
      <label class="field-label" for="cc-visit-date-input">Visit date</label>
      <input type="date" id="cc-visit-date-input" class="date-input" />
      <div class="modal-actions">
        <button class="btn secondary" id="cc-visit-cancel-btn" type="button">Cancel</button>
        <button class="btn" id="cc-visit-confirm-btn" type="button">Log visit</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="range-modal">
    <div class="modal-card modal-card-narrow modal-card-wide">
      <button class="modal-close" id="range-modal-close" aria-label="Close">&times;</button>
      <h2 id="range-modal-store"></h2>
      <div class="range-snapshot-tabs" id="range-snapshot-tabs"></div>
      <div id="range-snapshot-detail"></div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="cb-modal">
    <div class="modal-card modal-card-narrow">
      <button class="modal-close" id="cb-modal-close" aria-label="Close">&times;</button>
      <h2>Cycle Brief</h2>
      <p class="modal-store-name" id="cb-modal-store"></p>
      <p class="field-hint" id="cb-last-summary"></p>
      <div class="cb-row">
        <span class="cb-row-label">Direct Sale NPDs</span>
        <div class="stepper">
          <button data-action="cb-dec" data-cat="direct" type="button">−</button>
          <span class="qty" id="cb-qty-direct">0</span>
          <button data-action="cb-inc" data-cat="direct" type="button">+</button>
        </div>
      </div>
      <div class="cb-row">
        <span class="cb-row-label">Influence Sales NPDs</span>
        <div class="stepper">
          <button data-action="cb-dec" data-cat="influence" type="button">−</button>
          <span class="qty" id="cb-qty-influence">0</span>
          <button data-action="cb-inc" data-cat="influence" type="button">+</button>
        </div>
      </div>
      <div class="cb-row">
        <span class="cb-row-label">POS Activation</span>
        <div class="stepper">
          <button data-action="cb-dec" data-cat="pos" type="button">−</button>
          <span class="qty" id="cb-qty-pos">0</span>
          <button data-action="cb-inc" data-cat="pos" type="button">+</button>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn secondary" id="cb-cancel-btn" type="button">Cancel</button>
        <button class="btn" id="cb-confirm-btn" type="button">Save</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/vendor/leaflet/leaflet.js"></script>
  <script src="js/catalog.js"></script>
  <script src="js/layout-pp.js"></script>
  <script src="js/pp-stats.js"></script>
  <script src="js/pp-snapshot.js"></script>
  <script src="js/layout-callfile.js"></script>
  <script src="js/callfile-status.js"></script>
  <script src="js/map-geocode.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/map.js"></script>
  <script>renderNav("map");</script>
</body>
</html>
