<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Diageo Sales Presenter</title>
  <link rel="manifest" href="manifest.json" />
  <meta name="theme-color" content="#0b0b0d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="icon" type="image/png" href="images/favicon.png" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <main>
    <div class="hero-banner">
      <img src="images/Hero.png" alt="Diageo — The Home of Johnnie Walker, Smirnoff, Captain Morgan, Gordon's, Guinness &amp; Baileys" />
    </div>
    <div class="dash-stat-grid">
      <section class="week-panel" aria-label="This week's visit activity">
        <div class="week-panel-head">
          <div class="panel-head-title">
            <span class="panel-icon panel-icon-accent" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 20V14"></path><path d="M12 20V8"></path><path d="M18 20V4"></path></svg>
            </span>
            <h3>This Week</h3>
            <span class="secondary-badge hidden" id="territory-badge"></span>
          </div>
          <div class="week-nav">
            <button type="button" class="week-nav-btn" id="week-prev" aria-label="Previous week">‹</button>
            <span class="week-range" id="week-range"></span>
            <button type="button" class="week-nav-btn" id="week-next" aria-label="Next week">›</button>
          </div>
        </div>
        <div id="week-panel-body"></div>
      </section>

      <section class="month-panel" aria-label="Call file coverage this month">
        <div class="month-panel-head">
          <div class="panel-head-title">
            <span class="panel-icon panel-icon-good" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><path d="M8.5 12.5l2.5 2.5 4.5-5"></path></svg>
            </span>
            <h3>This Month</h3>
          </div>
          <span class="month-sub">Call File coverage</span>
        </div>
        <div id="month-panel-body"></div>
      </section>

      <section class="week-panel cycle-panel" aria-label="Cycle Brief activity this quarter">
        <div class="week-panel-head">
          <div class="panel-head-title">
            <span class="panel-icon panel-icon-accent" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v4"></path><path d="M12 18v4"></path><path d="M4.93 4.93l2.83 2.83"></path><path d="M16.24 16.24l2.83 2.83"></path><path d="M2 12h4"></path><path d="M18 12h4"></path><path d="M4.93 19.07l2.83-2.83"></path><path d="M16.24 7.76l2.83-2.83"></path></svg>
            </span>
            <h3>Cycle Brief</h3>
          </div>
          <span class="month-sub">This quarter</span>
        </div>
        <div id="cycle-panel-body"></div>
      </section>
    </div>

    <a class="deck-link" href="deck.html">
      <span class="deck-link-text">
        <span class="deck-link-title">Sales Presenter Deck</span>
        <span class="deck-link-sub">View the full presenter deck</span>
      </span>
      <span class="deck-link-arrow" aria-hidden="true">→</span>
    </a>

    <a class="deck-link" href="pp-deck.html">
      <span class="deck-link-text">
        <span class="deck-link-title">Partnership Program Deck</span>
        <span class="deck-link-sub">Pitch the tier ladder in-store</span>
      </span>
      <span class="deck-link-arrow" aria-hidden="true">→</span>
    </a>
  </main>

  <div class="modal-backdrop hidden" id="day-modal">
    <div class="modal-card modal-card-narrow">
      <button class="modal-close" id="day-modal-close" aria-label="Close">&times;</button>
      <h2 id="day-modal-title"></h2>
      <div id="day-modal-body"></div>
    </div>
  </div>
  <script type="module" src="js/firebase-config.js"></script>
  <script src="js/layout-callfile.js"></script>
  <script src="js/callfile-status.js"></script>
  <script src="js/home-stats.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/cloud-sync.js"></script>
  <script src="js/home.js"></script>
  <script>renderNav("home");</script>
</body>
</html>
